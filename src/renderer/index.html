<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'"><title>咕咕嘎嘎 · 定时提醒</title><link rel="stylesheet" href="style.css"></head><body>
<div id="notice" data-phase="entering" hidden>
<div id="cinema" aria-hidden="true" hidden><video src="assets/gugugaga-water-alpha.webm" muted playsinline preload="auto" disablepictureinpicture></video><img src="assets/gugugaga-water-rest.png" alt="" hidden></div>
<button id="noticeCharacter" class="interactive notice-character" type="button" aria-label="咕咕嘎嘎正在提醒你" hidden></button>
<div id="noticeCard" class="interactive notice-card" role="status" aria-live="polite" aria-labelledby="noticeTitle" hidden>
<button id="noticeClose" class="notice-close" type="button" aria-label="关闭提醒">×</button>
<small id="noticeEyebrow" class="notice-eyebrow" hidden>咕咕嘎嘎来提醒你</small>
<h2 id="noticeTitle">喝口水吧</h2>
<p id="noticeMessage" hidden>我也喝一口，陪你一起。</p>
<div id="restRing" class="rest-progress" hidden><span class="rest-track"><i id="restFill"></i></span><span><b id="restCount">20</b> 秒</span></div>
<div class="notice-actions"><button id="noticeDone" class="notice-primary" type="button">喝好了</button><button id="noticeLater" type="button">稍后</button></div>
</div>
</div>
<section id="panel" class="interactive" hidden aria-labelledby="settingsTitle">
<header><div><small>GUGUGAGA</small><h1 id="settingsTitle">提醒设置</h1></div><button id="close" aria-label="关闭设置">×</button></header>
<p class="intro">平时安静等待，到时间再出来提醒你。</p>
<form id="reminderSettings" class="reminder-settings" aria-labelledby="reminderSettingsTitle">
<div class="interval-heading"><h2 id="reminderSettingsTitle">提醒间隔</h2><span>单位：分钟</span></div>
<div class="interval-grid">
<label for="waterInterval">💧 喝水<input id="waterInterval" type="number" min="1" max="1440" step="1" value="60" required aria-label="喝水提醒间隔（分钟）"></label>
<label for="walkInterval">🐧 走动<input id="walkInterval" type="number" min="1" max="1440" step="1" value="50" required aria-label="走动提醒间隔（分钟）"></label>
<label for="eyesInterval">👀 眼睛休息<input id="eyesInterval" type="number" min="1" max="1440" step="1" value="40" required aria-label="眼睛休息提醒间隔（分钟）"></label>
</div>
<div class="interval-footer"><span id="intervalStatus" role="status" aria-live="polite">修改的项目从保存时重新计时</span><button id="saveIntervals" type="submit">保存</button></div>
</form>
</section>
<script src="generated/reminder-cinema.js"></script><script src="app.js"></script>
</body></html>
